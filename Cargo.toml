[workspace]
resolver = "2"
members = [
    "contracts/stellar-feed",
    "contracts/stellar-feed-sdk",
    "contracts/demo-consumer",
    "worker",
]

# Release profile lives here (workspace root): per-package profiles in
# members are ignored by Cargo with a warning.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
