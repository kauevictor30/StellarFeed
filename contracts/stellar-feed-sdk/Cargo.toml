[package]
name = "stellar-feed-sdk"
version = "0.1.0"
edition = "2021"
description = "Typed Rust client for the StellarFeed Pyth-backed price oracle (Soroban)"
license = "Apache-2.0"
repository = "https://github.com/kauevictor30/StellarFeed"
keywords = ["stellar", "soroban", "oracle", "pyth"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
# Must match the MAJOR version your consumer contract uses (and the
# network protocol). StellarFeed itself builds on soroban-sdk 26.
soroban-sdk = "26"

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }
