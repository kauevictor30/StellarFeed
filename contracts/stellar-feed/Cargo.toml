[package]
name = "stellar-feed"
version = "0.1.0"
edition = "2021"
description = "StellarFeed — oráculo de preços nativo da rede Stellar (Soroban)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
soroban-sdk = "27"

[dev-dependencies]
soroban-sdk = { version = "27", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
