[package]
name = "stellar-feed-worker"
version = "0.1.0"
edition = "2021"
description = "StellarFeed off-chain worker: CoinGecko -> Soroban (pure Rust, no Python)"
license = "Apache-2.0"

[[bin]]
name = "stellar-feed-worker"
path = "src/main.rs"

[dependencies]
# HTTP + async runtime
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
# Serialization / errors / logs / time / env
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
