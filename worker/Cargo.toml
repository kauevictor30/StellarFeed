[package]
name = "stellar-feed-worker"
version = "0.2.0"
edition = "2021"
description = "StellarFeed relay worker: Pyth Lazer websocket -> Soroban (pure Rust, no Python)"
license = "Apache-2.0"

[[bin]]
name = "stellar-feed-worker"
path = "src/main.rs"

[dependencies]
# Async runtime + websocket client (Pyth Pro stream) + HTTP (RPC health)
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
# Serialization / errors / logs / env
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
